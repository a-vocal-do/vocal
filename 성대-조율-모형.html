<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성대 조율 모형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122054; --ink-2:#5A6893; --stage:#0B1436; --paper:#FCFCFB;
  --coral:#E4572E; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); overscroll-behavior:none;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{
  height:100dvh; max-width:560px; margin:0 auto;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:grid; grid-template-rows:minmax(0,1fr) auto; gap:12px;
}

.stage{
  position:relative; background:var(--stage); border-radius:14px; overflow:hidden;
  min-height:0; display:flex; align-items:center; justify-content:center; padding:10px;
}
.canvas{width:100%; max-height:100%; aspect-ratio:1660/1000; display:flex; align-items:stretch}
.pa{width:59.63%; position:relative}
.gapx{width:3.02%}
.pb{width:37.35%; position:relative}
.pa img,.pb>img{position:absolute; inset:0; width:100%; height:100%; object-fit:fill}
.half{position:absolute; inset:0; transform-origin:50% 91.8%; will-change:transform}
.half.l{clip-path:inset(0 50% 0 0)}
.half.r{clip-path:inset(0 0 0 50%)}
.half .sh{will-change:opacity}
#flow{position:absolute; inset:0; width:100%; height:100%}

.panel{display:grid; row-gap:6px}
.grid{display:grid; grid-template-columns:76px 30px minmax(0,1fr) 40px; align-items:center; column-gap:10px}
.lockhd{grid-column:4; text-align:center; font-size:11px; color:var(--ink-2); letter-spacing:.04em}
.row label.nm{font-size:13px; font-weight:500; white-space:nowrap}
.row .v{font-family:var(--mono); font-weight:500; font-size:15px; text-align:right; font-variant-numeric:tabular-nums}
.row input[type=range]{margin:0}
.ends{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--ink-2); margin-top:-2px}
.row .lk{justify-self:center}
.row.off label.nm,.row.off .v,.row.off .ends{opacity:.4}

input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; background:transparent;
  height:28px; cursor:pointer; display:block;
}
input[type=range]:disabled{cursor:default; opacity:.35}
input[type=range]:focus-visible{outline:2px solid var(--coral); outline-offset:2px; border-radius:6px}
input[type=range]::-webkit-slider-runnable-track{height:3px; background:rgba(18,32,84,.16); border-radius:2px}
input[type=range]::-moz-range-track{height:3px; background:rgba(18,32,84,.16); border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:24px; height:24px; margin-top:-10.5px;
  border-radius:50%; background:var(--paper); border:2px solid var(--ink);
}
input[type=range]::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:var(--paper); border:2px solid var(--ink)}
input[type=range]:active:not(:disabled)::-webkit-slider-thumb{border-color:var(--coral)}
input[type=range]:active:not(:disabled)::-moz-range-thumb{border-color:var(--coral)}

input[type=checkbox]{
  -webkit-appearance:none; appearance:none; margin:0; width:20px; height:20px;
  border:1.5px solid rgba(18,32,84,.3); border-radius:6px; background:transparent;
  cursor:pointer; position:relative; -webkit-tap-highlight-color:transparent;
}
input[type=checkbox]:checked{background:var(--ink); border-color:var(--ink)}
input[type=checkbox]:checked::after{
  content:""; position:absolute; left:6px; top:2px; width:5px; height:10px;
  border:solid var(--paper); border-width:0 2px 2px 0; transform:rotate(43deg);
}
input[type=checkbox]:focus-visible{outline:2px solid var(--coral); outline-offset:2px}
</style>
</head>

        <svg id="flow" viewBox="0 0 100 300" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="grid"><div class="lockhd">고정</div></div>

    <div class="row grid" id="rowTa">
      <label class="nm" for="ta">TA근</label>
      <div class="v" id="vTa">0</div>
      <div>
        <input type="range" id="ta" min="-5" max="5" step="1" value="0">
        <div class="ends"><span>성대 얇아짐</span><span>성대 두꺼워짐</span></div>
      </div>
      <input type="checkbox" class="lk" id="lkTa" aria-label="TA근 고정">
    </div>

    <div class="row grid" id="rowPs">
      <label class="nm" for="ps">호기압</label>
      <div class="v" id="vPs">0</div>
      <div>
        <input type="range" id="ps" min="-5" max="5" step="1" value="0">
        <div class="ends"><span>호흡 느려짐</span><span>호흡 빨라짐</span></div>
      </div>
      <input type="checkbox" class="lk" id="lkPs" aria-label="호기압 고정">
    </div>

    <div class="row grid" id="rowAb">
      <label class="nm" for="ab">성대 벌림</label>
      <div class="v" id="vAb">0</div>
      <div>
        <input type="range" id="ab" min="0" max="10" step="1" value="0">
        <div class="ends"><span>성대 닫힘</span><span>성대 벌어짐</span></div>
      </div>
      <input type="checkbox" class="lk" id="lkAb" aria-label="성대 벌림 고정">
    </div>

  </div>

</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var S={ta:0,ps:0,ab:0}, phase=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sign(n){ return n>0 ? '+'+n : (n<0 ? '\u2212'+Math.abs(n) : '0'); }

  function draw(){
    var ta=S.ta, ps=S.ps, ab=S.ab, lv=ps+5;
    $('vTa').textContent=sign(ta);
    $('vPs').textContent=sign(ps);
    $('vAb').textContent=ab;

    var o=((ta+5)/10).toFixed(3);
    $('fS').style.opacity=o; $('sL').style.opacity=o; $('sR').style.opacity=o;

    var d=ab-5, base=d>=0 ? 0.80*d : 0.24*d;
    var vib=reduce?0:(0.34*lv/10)*(0.5+0.5*Math.sin(phase));
    var th=base+vib;
    $('hl').style.transform='rotate('+(-th).toFixed(3)+'deg)';
    $('hr').style.transform='rotate('+th.toFixed(3)+'deg)';

    var n=Math.max(0,Math.round(lv/2.2)), s='';
    for(var i=0;i<n;i++){
      var x=50+((n===1)?0:(i/(n-1)-0.5)*34);
      var y0=296, y1=228-lv*1.2;
      var op=(0.22+0.05*lv).toFixed(2);
      var wob=reduce?0:Math.sin(phase*0.7+i)*2.5;
      s+='<path d="M'+x.toFixed(1)+' '+y0+' Q'+(x+wob).toFixed(1)+' '+((y0+y1)/2).toFixed(1)+' '+x.toFixed(1)+' '+y1.toFixed(1)+'" fill="none" stroke="#BCD0E8" stroke-width="2.4" stroke-linecap="round" opacity="'+op+'" vector-effect="non-scaling-stroke"/>';
      s+='<path d="M'+(x-4).toFixed(1)+' '+(y1+7).toFixed(1)+' L'+x.toFixed(1)+' '+y1.toFixed(1)+' L'+(x+4).toFixed(1)+' '+(y1+7).toFixed(1)+'" fill="none" stroke="#BCD0E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="'+op+'" vector-effect="non-scaling-stroke"/>';
    }
    $('flow').innerHTML=s;

    phase+=reduce?0:(0.09+0.042*lv);
  }

  ['ta','ps','ab'].forEach(function(k){
    $(k).addEventListener('input',function(){ S[k]=+this.value; draw(); });
  });
  [['lkTa','ta','rowTa'],['lkPs','ps','rowPs'],['lkAb','ab','rowAb']].forEach(function(p){
    $(p[0]).addEventListener('change',function(){
      $(p[1]).disabled=this.checked;
      $(p[2]).classList.toggle('off',this.checked);
    });
  });

  draw();
  setInterval(draw,45);
})();
</script>
